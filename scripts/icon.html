<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <style>
    html, body {
      margin: 0;
      width: 180px;
      height: 180px;
      background: radial-gradient(circle at 25% 10%, #7aeaff, transparent 50%), linear-gradient(145deg, #2279ec, #061947);
      display: grid;
      place-items: center;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      color: #fff;
    }
    span { display: grid; place-items: center; width: 140px; height: 140px; border: 2px solid #b4edff; border-radius: 35px; box-shadow: inset 0 0 12px #c4f5ff, 0 0 18px #39bfff; font-size: 112px; font-weight: 900; line-height: 1; text-shadow: 0 5px 0 #236cca; }
  </style>
</head>
<body>
  <span>N</span>
</body>
</html>
