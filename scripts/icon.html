<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <style>
    @font-face { font-family: Fredoka; src: url('../fonts/fredoka.ttf'); font-weight: 300 700; }
    html, body {
      margin: 0;
      width: 180px;
      height: 180px;
      background: radial-gradient(circle at 25% 10%, #fff, transparent 50%), linear-gradient(145deg, #edf2f4, #bdcbd6);
      display: grid;
      place-items: center;
      font-family: Fredoka, -apple-system, sans-serif;
      color: #526674;
    }
    span { display: grid; place-items: center; width: 140px; height: 140px; border: 2px solid #fff; border-radius: 35px; box-shadow: inset 2px 2px 3px #fff, inset -3px -3px 4px #fff9, 0 7px 12px #8094a555; font-size: 112px; font-weight: 650; line-height: 1; text-shadow: 0 2px 0 #fff; }
  </style>
</head>
<body>
  <span>N</span>
</body>
</html>
