<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <style>
    html, body {
      margin: 0;
      width: 1200px;
      height: 630px;
      background: #ffffff;
      color: #1a1a1b;
      font-family: Georgia, "Iowan Old Style", Palatino, serif;
      display: grid;
      place-items: center;
    }
    .wrap { text-align: center; }
    h1 {
      font-size: 112px;
      letter-spacing: 0.02em;
      margin: 0;
      line-height: 1;
    }
    .pair {
      margin-top: 18px;
      font-size: 52px;
      font-weight: 700;
      letter-spacing: 0.06em;
    }
    .dot { color: #5c5e60; font-weight: 400; margin: 0 0.12em; }
    .sub {
      margin-top: 28px;
      font-family: Helvetica, Arial, sans-serif;
      font-size: 24px;
      color: #5c5e60;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Given</h1>
    <div class="pair">B<span class="dot">·</span>H</div>
    <div class="sub">Guess the given name.</div>
  </div>
</body>
</html>
