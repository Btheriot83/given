<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <style>
    @font-face { font-family: Fredoka; src: url('../fonts/fredoka.ttf'); font-weight: 300 700; }
    html, body {
      margin: 0;
      width: 1200px;
      height: 630px;
      background: radial-gradient(ellipse at 50% 25%, #fff, #dce5ea 85%);
      color: #cdd9e2;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      display: grid;
      place-items: center;
    }
    .wrap { text-align: center; }
    h1 {
      font-family: Fredoka, -apple-system, sans-serif;
      font-size: 112px;
      letter-spacing: -.055em;
      font-weight: 650;
      -webkit-text-stroke: 1px #fff;
      text-shadow: 0 3px 0 #97aab7, 0 6px 0 #8a9eac, 0 9px 12px #798d9e55;
      margin: 0;
      line-height: 1;
    }
    .pair {
      margin-top: 18px;
      font-size: 52px;
      font-weight: 700;
      letter-spacing: 0.06em;
    }
    .pair span { display: inline-grid; place-items: center; width: 72px; height: 76px; margin: 0 4px; border: 2px solid #b6edff; border-radius: 14px; background: linear-gradient(140deg, #a0ffd2, #11d58e 55%, #00a86d); box-shadow: inset 0 2px 4px #fff9, 0 5px 0 #00835d; color: #fff; text-shadow: 0 2px 2px #00664788; }
    .sub {
      margin-top: 28px;
      font-family: inherit;
      font-size: 24px;
      color: #526674;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Named</h1>
    <div class="pair"><span>N</span><span>A</span><span>M</span><span>E</span><span>D</span></div>
    <div class="sub">A familiar name. A daily discovery.</div>
  </div>
</body>
</html>
